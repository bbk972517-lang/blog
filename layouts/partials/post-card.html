<article class="post-card">{{ with .Params.cover }}<a class="cover-link" href="{{ $.RelPermalink }}" tabindex="-1" aria-hidden="true"><img loading="lazy" src="{{ . | partial "url.html" }}" alt=""></a>{{ end }}<div class="post-meta">{{ if eq .Section "posts" }}{{ .Date.Format "2006.01.02" }}{{ end }}{{ with .Params.tags }}{{ range first 1 . }}<span>{{ . }}</span>{{ end }}{{ end }}</div><h3><a href="{{ .RelPermalink }}">{{ .Title }}</a></h3><p>{{ .Description }}</p><a class="text-link" href="{{ .RelPermalink }}">继续阅读 ↗</a></article>
